[project]
name = "inventario-backend"
version = "0.1.0"
description = "API del sistema de inventario, pedidos y rentabilidad"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "celery[redis]>=5.4",
    "python-multipart>=0.0.20",
    "rapidocr>=3.10",
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.10",
    "pdfplumber>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    # Starlette recomienda httpx2; se mantiene httpx hasta evaluar la migración.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # Depends() en argumentos por defecto es el patrón de FastAPI

[tool.ruff.lint.per-file-ignores]
"**/models.py" = ["RUF012"]  # __mapper_args__ es configuración declarativa de SQLAlchemy

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "onnxruntime.*", "rapidocr.*", "pdfplumber.*", "cv2.*"]
ignore_missing_imports = true
