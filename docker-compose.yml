name: inventario

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  # Sin salida a internet: los datos (y las OC que se leen) no salen del equipo.
  networks: [interna]
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/La_Paz
    volumes:
      - db_datos:/var/lib/postgresql/data
    # Solo accesible desde este equipo (para desarrollo y respaldos).
    ports:
      - "127.0.0.1:${PUERTO_DB:-5433}:5432"
    networks: [interna, default]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks: [interna]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    <<: *backend
    volumes:
      - archivos:/datos/archivos
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/salud')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *backend
    # Lee las OC (OCR local): necesita los archivos subidos.
    volumes:
      - archivos:/datos/archivos
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]

  # Dispara las tareas programadas: revisión de alertas (cada 10 min) y pronóstico (semanal).
  beat:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    environment:
      SITIO_DIRECCION: ${SITIO_DIRECCION:-:80}
    ports:
      - "${PUERTO_WEB:-8080}:80"
      - "${PUERTO_WEB_HTTPS:-8443}:443"
    volumes:
      - caddy_datos:/data
    networks: [interna, default]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  interna:
    internal: true

volumes:
  db_datos:
  caddy_datos:
  archivos:
